<!doctype html>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<title>ChineseReads — TikTok authorisation</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 40rem; margin: 4rem auto;
         padding: 0 1.5rem; line-height: 1.6; color: #222; }
  h1 { font-size: 1.4rem; }
  #code { display: block; background: #f4f4f5; padding: 1rem; border-radius: .5rem;
          word-break: break-all; font-size: 1rem; margin: 1rem 0;
          font-family: ui-monospace, monospace; }
  .err { color: #b91c1c; }
  .nota { font-size: .9rem; color: #555; }
</style>
<h1>TikTok authorisation complete</h1>
<p id="mensaje">Reading the response…</p>
<code id="code" hidden></code>
<p class="nota" id="nota" hidden>
  This one-time authorisation code expires in a few minutes and is useless on
  its own: exchanging it for an access token also requires the client secret,
  which never leaves our server.
</p>
<script>
  // Static page, no backend: it only displays the authorisation code that
  // TikTok returns in the URL. Nothing is stored and nothing is sent anywhere.
  // textContent (never innerHTML) so URL contents can't be treated as markup.
  const p = new URLSearchParams(location.search);
  const code = p.get("code");
  const error = p.get("error_description") || p.get("error");
  const mensaje = document.getElementById("mensaje");
  if (code) {
    mensaje.textContent = "Authorisation code received:";
    const salida = document.getElementById("code");
    salida.textContent = code;
    salida.hidden = false;
    document.getElementById("nota").hidden = false;
  } else if (error) {
    mensaje.className = "err";
    mensaje.textContent = "TikTok returned an error: " + error;
  } else {
    mensaje.textContent = "This page is only the redirect target of the TikTok "
      + "authorisation flow. There is nothing to see here.";
  }
</script>
